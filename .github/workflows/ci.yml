name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request supersedes the run already in flight, and
  # nothing downstream waits on the older one. Push events are exempt: a push
  # run is the record that a given commit passed, so it always finishes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-versions.mjs
      - run: npm pack --dry-run
